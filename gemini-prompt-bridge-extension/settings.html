<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pengaturan Gemini Bridge</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="settings.css">
  </head>
  <body class="settings-page">
    <main>
      <header>
        <div class="mark" aria-hidden="true">G</div>
        <div>
          <h1>Pengaturan Gemini Bridge</h1>
          <p>Penghubung Python lokal untuk profil Chrome ini</p>
        </div>
      </header>

      <section class="settings-form" aria-label="Pengaturan bridge">
        <label for="profileId">ID profil Python</label>
        <input id="profileId" type="text" maxlength="64" placeholder="tes6" autocomplete="off">

        <label for="bridgeKey">Kunci bridge lokal</label>
        <input id="bridgeKey" type="password" autocomplete="off" spellcheck="false">

        <button id="saveSettings" type="button">Simpan & hubungkan</button>
        <div id="status" class="status" role="status">Memeriksa koneksi...</div>
      </section>

      <p class="note">Halaman ini tetap terbuka saat kamu berpindah ke terminal. Extension hanya mengirim prompt ke tab Gemini pada profil ini; data akun dan sesi tidak diambil.</p>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
